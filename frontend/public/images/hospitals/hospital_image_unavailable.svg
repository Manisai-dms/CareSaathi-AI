<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  
  <!-- Subtle healthcare building icon -->
  <g transform="translate(400, 190)" text-anchor="middle">
    <path d="M -40 30 L -40 -30 L 40 -30 L 40 30 Z" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linejoin="round" />
    <path d="M -20 -30 L -20 -45 L 20 -45 L 20 -30" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linejoin="round" />
    <path d="M 0 -40 L 0 -35 M -5 -37.5 L 5 -37.5" stroke="#2C8C83" stroke-width="3" stroke-linecap="round" />
    <!-- Cross on building -->
    <rect x="-4" y="-14" width="8" height="24" rx="2" fill="#CBD5E1" />
    <rect x="-12" y="-6" width="24" height="8" rx="2" fill="#CBD5E1" />
    <!-- Windows -->
    <rect x="-28" y="-18" width="8" height="10" rx="1" fill="#CBD5E1" />
    <rect x="20" y="-18" width="8" height="10" rx="1" fill="#CBD5E1" />
    <rect x="-28" y="2" width="8" height="10" rx="1" fill="#CBD5E1" />
    <rect x="20" y="2" width="8" height="10" rx="1" fill="#CBD5E1" />
    <!-- Ground line -->
    <line x1="-70" y1="30" x2="70" y2="30" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Neutral text -->
  <text x="400" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#475569">
    Hospital image unavailable
  </text>
  <text x="400" y="296" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    Verified photography will appear once confirmed by facility
  </text>
</svg>
